  <style>
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: #15191f;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
    }
    #phone {
      position: relative;
      width: 360px;
      height: 640px;
      overflow: hidden;
      color: white;
      background: url("../assets/backgrounds/gray_texture_360x640.png") center / cover no-repeat;
      image-rendering: pixelated;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    .screen, .overlay {
      position: absolute;
      inset: 0;
    }
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 44px;
      background: url("../assets/ui/topbar_360x44.png") center / 100% 100% no-repeat;
    }
    .logo {
      position: absolute;
      object-fit: contain;
      image-rendering: auto;
    }
    .label {
      position: absolute;
      margin: 0;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.65);
      overflow-wrap: break-word;
    }
    button {
      border: 0;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .orange {
      position: absolute;
      display: grid;
      place-items: center;
      color: white;
      font: 700 16px Arial, Helvetica, sans-serif;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.52);
      background: url("../assets/ui/button_orange_220x48.png") center / 100% 100% no-repeat;
    }
    .orange.big {
      background-image: url("../assets/ui/button_orange_250x52.png");
    }
    .orange.small {
      background-image: url("../assets/ui/button_orange_180x40.png");
      font-size: 13px;
    }
    .orange:active {
      transform: translateY(1px);
      filter: brightness(0.92);
    }
    .orange:disabled {
      cursor: default;
      filter: grayscale(1);
      opacity: 0.64;
      transform: none;
    }
    .icon-btn {
      position: absolute;
      width: 32px;
      height: 32px;
      background: transparent;
    }
    .icon-btn img {
      width: 32px;
      height: 32px;
      pointer-events: none;
    }
    .icon-btn.icon-fallback {
      display: grid;
      place-items: center;
      border: 1px solid #123f54;
      border-radius: 6px;
      color: #fff;
      background: #3b819d;
      font: 700 13px Arial, Helvetica, sans-serif;
    }
    .actions {
      position: absolute;
      left: 42px;
      top: 312px;
      width: 276px;
      height: 306px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .actions-inner {
      position: relative;
      height: 472px;
    }
    .shade {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }
    .panel {
      position: absolute;
      left: 15px;
      background: url("../assets/ui/popup_panel_blue_330x520.png") center / 100% 100% no-repeat;
    }
    .close {
      position: absolute;
      width: 32px;
      height: 32px;
      background: url("../assets/icons/icon_close_32.png") center / 32px 32px no-repeat;
    }
    .tab {
      position: absolute;
      width: 76px;
      height: 32px;
      border: 2px solid #5b7f9e;
      border-radius: 6px;
      color: #0c1d31;
      background: #d3e1ee;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .tab.active {
      border-color: #e87512;
      background: #f2c650;
    }
    .scroll {
      position: absolute;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .row {
      position: relative;
      width: 296px;
      min-height: 52px;
      margin: 0 0 8px;
      border: 2px solid #567f9d;
      border-radius: 6px;
      color: #0c1d31;
      background: #dbeaf5;
      font-size: 13px;
      overflow: hidden;
    }
    .row.muted {
      opacity: 0.62;
    }
    .row.locked {
      background: #c2cad3;
    }
    .row-title {
      position: absolute;
      left: 54px;
      top: 6px;
      width: 164px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-sub {
      position: absolute;
      left: 54px;
      top: 28px;
      width: 164px;
      font-size: 12px;
      line-height: 1.18;
      overflow: hidden;
    }
    .pokemon-anim {
      image-rendering: pixelated;
      pointer-events: none;
    }
    .dex-desc {
      position: absolute;
      left: 12px;
      top: 84px;
      width: 272px;
      height: 62px;
      font-size: 10px;
      line-height: 1.18;
      overflow: hidden;
    }
    .center-status {
      position: absolute;
      left: 42px;
      top: 500px;
      width: 276px;
      height: 36px;
      display: grid;
      place-items: center;
      color: #0c1d31;
      font: 700 11px Arial, Helvetica, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .placeholder {
      position: absolute;
      display: grid;
      place-items: center;
      border-radius: 4px;
      color: white;
      background: #557995;
      font-weight: 700;
    }
    .map-thumb {
      position: absolute;
      left: 10px;
      top: 7px;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: #fff;
      background: #557995;
      font: 800 15px Arial, Helvetica, sans-serif;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .map-thumb::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14px;
      background: rgba(0, 0, 0, 0.25);
    }
    .avatar-card {
      position: absolute;
      width: 92px;
      height: 92px;
      border: 2px solid #5b7f9e;
      border-radius: 6px;
      color: #0c1d31;
      background: #d3e1ee;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .avatar-card.active {
      border: 3px solid #e87512;
      background: #f2c650;
    }
    .avatar-card img {
      position: absolute;
      left: 18px;
      top: 8px;
      width: 56px;
      height: 56px;
      object-fit: contain;
      pointer-events: none;
    }
    .avatar-card span {
      position: absolute;
      left: 4px;
      bottom: 7px;
      width: 84px;
      text-align: center;
      line-height: 1.1;
      pointer-events: none;
    }
    .newgame-content {
      position: relative;
      width: 304px;
      height: 740px;
    }
    .desc {
      position: absolute;
      left: 28px;
      top: 398px;
      width: 304px;
      height: 102px;
      padding: 9px 12px;
      border: 2px solid #567f9d;
      border-radius: 6px;
      color: #0c1d31;
      background: #e3eef7;
      font-size: 13px;
      line-height: 1.25;
    }
    .buy {
      position: absolute;
      right: 10px;
      top: 26px;
      width: 64px;
      height: 32px;
      border: 2px solid #e87512;
      border-radius: 6px;
      color: #0c1d31;
      background: #f2c650;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .buy:disabled {
      cursor: default;
      filter: grayscale(1);
      opacity: 0.6;
    }
    .notice {
      position: absolute;
      left: 42px;
      bottom: 26px;
      width: 276px;
      min-height: 34px;
      padding: 8px;
      border-radius: 6px;
      color: #0c1d31;
      background: #f2c650;
      text-align: center;
      font-weight: 700;

      height: 22px;

      font: 700 12px Arial, Helvetica, sans-serif;

    function healTeam() {
      ensureSave();
      if (healingInProgress) return;
      const status = document.getElementById("centerStatus");
      if ((save.money || 0) < pokemonCenterCost) {
        if (status) status.textContent = t("not_enough_money_center");
        return;
      }
      healingInProgress = true;
      save.money -= pokemonCenterCost;
      persist();
      const button = document.querySelector(".orange[onclick='healTeam()']");
      if (button) button.disabled = true;
      let remaining = pokemonCenterSeconds;
      const updateStatus = () => {
        const currentStatus = document.getElementById("centerStatus");
        if (currentStatus) currentStatus.textContent = t("healing_started", { seconds: remaining });
      };
      updateStatus();
      const timer = setInterval(() => {
        remaining -= 1;
        if (remaining > 0) {
          updateStatus();
          return;
        }
        clearInterval(timer);
        save.team = save.team.map(pokemon => ({ ...pokemon, hp: pokemon.max_hp || 39 }));
        healingInProgress = false;
        persist();
        if (document.getElementById("centerStatus")) {
          showPokemonCenter();
          const doneStatus = document.getElementById("centerStatus");
          if (doneStatus) doneStatus.textContent = t("healed_team");
        } else {
          showHome();
        }
      }, 1000);

        <p class="label" style="left:42px;top:205px;width:276px;color:#0c1d31;text-shadow:none;font-size:18px">${body}</p>
        <button class="close" style="left:298px;top:128px" onclick="closeOverlay()"></button>
        ${orange("OK", 70, 370, 220, 48, "closeOverlay()")}
      </div>`;
    }
    function confirmExit() {
      phone.innerHTML = phone.innerHTML + `<div class="overlay"><div class="shade"></div><div class="panel" style="top:150px;height:300px;width:330px"></div>
        <p class="label" style="left:44px;top:184px;width:272px;color:#0c1d31;text-shadow:none;font-size:22px">${t("exit")}</p>
        <p class="label" style="left:42px;top:246px;width:276px;color:#0c1d31;text-shadow:none;font-size:18px">${t("return_menu")}</p>
        ${orange(t("yes"), 38, 356, 140, 44, "showMainMenu()", "small")}
        ${orange(t("no"), 182, 356, 140, 44, "closeOverlay()", "small")}
      </div>`;
    }
    function secretDebugClick() {
      const now = Date.now();
      if (now > debugDeadline) debugClicks = 0;
      debugClicks += 1;
      debugDeadline = now + 5000;
      if (debugClicks >= 4) {
        debugClicks = 0;
        debugDeadline = 0;
        showDebugMenu();
      }
    }
    function showDebugMenu() {
      if (!save) { message(t("debug_menu"), t("no_active_save")); return; }
      phone.innerHTML += overlay(t("debug_menu"), 72, 480) + `
        ${orange(t("debug_money"), 70, 148, 220, 48, "debugMoney()")}
        ${orange(t("debug_level"), 70, 204, 220, 48, "debugLevel()")}
        ${orange(t("debug_xp"), 70, 260, 220, 48, "debugXP()")}
        ${orange(t("debug_badge"), 70, 316, 220, 48, "debugBadge()")}
        ${orange(t("heal_team"), 70, 372, 220, 48, "debugHeal()")}
        <button class="tab" style="left:42px;top:430px;width:132px;height:34px" onclick="debugItems()">${t("debug_items")}</button>
        <button class="tab" style="left:186px;top:430px;width:132px;height:34px" onclick="closeOverlay()">${t("close")}</button>
      </div>`;
    }
    function saveDebug() {
      persist();
      showHome();
      showDebugMenu();
    }
    function debugMoney() { ensureSave(); save.money += 10000; saveDebug(); }
    function debugLevel() {
      ensureSave();
      save.level += 1;
      save.team = save.team.map(pokemon => ({ ...pokemon, level: (pokemon.level || 5) + 1 }));
      saveDebug();
    }
    function debugXP() {
      ensureSave();
      save.xp = (save.xp || 0) + 100;
      save.team = save.team.map(pokemon => ({ ...pokemon, xp: (pokemon.xp || 0) + 100 }));
      saveDebug();
    }
    function debugBadge() { ensureSave(); save.badges = Math.min(8, save.badges + 1); saveDebug(); }
    function debugHeal() {
      ensureSave();
      save.team = save.team.map(pokemon => ({ ...pokemon, hp: pokemon.max_hp || 39 }));
      saveDebug();
    }
    function debugItems() {
      ensureSave();
      save.inventory.poke_ball = (save.inventory.poke_ball || 0) + 10;
      save.inventory.potion = (save.inventory.potion || 0) + 10;
      save.inventory.great_ball = (save.inventory.great_ball || 0) + 5;
      saveDebug();
    }
    window.t = t;
    window.stats = stats;
    window.loadGame = showLoadGamePopup;
    window.newGame = showNewGamePopup;
    window.showLoadGamePopup = showLoadGamePopup;
	    window.showNewGamePopup = showNewGamePopup;
	    window.selectStarter = selectStarter;
	    window.startNewGame = startNewGame;
    window.loadSlot = loadSlot;
    window.deleteSlot = deleteSlot;
    window.showHome = showHome;
    window.showMainMenu = showMainMenu;
	    window.showWorldMap = showWorldMap;
	    window.showForestMap = showForestMap;
	    window.showBattle = showBattle;
	    window.openBattleMoves = openBattleMoves;
	    window.battleMove = battleMove;
    window.showBag = showBag;
    window.showShop = showShop;
    window.showTournament = showTournament;
    window.showPokemonMenu = showPokemonMenu;
    window.showOptions = showOptions;
    window.showProfile = showProfile;
    window.showMyPokemon = showMyPokemon;
    window.showMyTeamPokemon = showMyTeamPokemon;
    window.showPokedex = showPokedex;
    window.showPokemonCenter = showPokemonCenter;
    window.healTeam = healTeam;
    window.message = message;
    window.confirmExit = confirmExit;
    window.secretDebugClick = secretDebugClick;
    window.showDebugMenu = showDebugMenu;
    window.debugMoney = debugMoney;
    window.debugLevel = debugLevel;
    window.debugXP = debugXP;
    window.debugBadge = debugBadge;
    window.debugHeal = debugHeal;
    window.debugItems = debugItems;
    window.closeOverlay = closeOverlay;
    window.redrawBase = redrawBase;
    window.chooseBagCategory = chooseBagCategory;
    window.chooseShopCategory = chooseShopCategory;
    window.selectBagItem = selectBagItem;
    window.setLanguage = setLanguage;
    window.useBagItem = useBagItem;
    window.buyItem = buyItem;
    window.settings = settings;
    window.previewAvatar = 1;
    Object.defineProperty(window, "bagCategory", { get: () => bagCategory, set: value => { bagCategory = value; } });
    Object.defineProperty(window, "shopCategory", { get: () => shopCategory, set: value => { shopCategory = value; } });
    Object.defineProperty(window, "selectedItemId", { get: () => selectedItemId, set: value => { selectedItemId = value; } });
    showMainMenu();
  </script>
</body>
</html>
