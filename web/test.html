<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeRPG UI Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: #15191f;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
    }
    #phone {
      position: relative;
      width: 360px;
      height: 640px;
      overflow: hidden;
      color: white;
      background: url("../assets/backgrounds/gray_texture_360x640.png") center / cover no-repeat;
      image-rendering: pixelated;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    .screen, .overlay {
      position: absolute;
      inset: 0;
    }
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 44px;
      background: url("../assets/ui/topbar_360x44.png") center / 100% 100% no-repeat;
    }
    .logo {
      position: absolute;
      object-fit: contain;
      image-rendering: auto;
    }
    .label {
      position: absolute;
      margin: 0;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.65);
      overflow-wrap: break-word;
    }
    button {
      border: 0;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .orange {
      position: absolute;
      display: grid;
      place-items: center;
      color: white;
      font: 700 16px Arial, Helvetica, sans-serif;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.52);
      background: url("../assets/ui/button_orange_220x48.png") center / 100% 100% no-repeat;
    }
    .orange.big {
      background-image: url("../assets/ui/button_orange_250x52.png");
    }
    .orange.small {
      background-image: url("../assets/ui/button_orange_180x40.png");
      font-size: 13px;
    }
    .orange:active {
      transform: translateY(1px);
      filter: brightness(0.92);
    }
    .icon-btn {
      position: absolute;
      width: 32px;
      height: 32px;
      background: transparent;
    }
    .icon-btn img {
      width: 32px;
      height: 32px;
      pointer-events: none;
    }
    .icon-btn.icon-fallback {
      display: grid;
      place-items: center;
      border: 1px solid #123f54;
      border-radius: 6px;
      color: #fff;
      background: #3b819d;
      font: 700 13px Arial, Helvetica, sans-serif;
    }
    .actions {
      position: absolute;
      left: 42px;
      top: 312px;
      width: 276px;
      height: 306px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .actions-inner {
      position: relative;
      height: 472px;
    }
    .shade {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }
    .panel {
      position: absolute;
      left: 15px;
      background: url("../assets/ui/popup_panel_blue_330x520.png") center / 100% 100% no-repeat;
    }
    .close {
      position: absolute;
      width: 32px;
      height: 32px;
      background: url("../assets/icons/icon_close_32.png") center / 32px 32px no-repeat;
    }
    .tab {
      position: absolute;
      width: 76px;
      height: 32px;
      border: 2px solid #5b7f9e;
      border-radius: 6px;
      color: #0c1d31;
      background: #d3e1ee;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .tab.active {
      border-color: #e87512;
      background: #f2c650;
    }
    .scroll {
      position: absolute;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .row {
      position: relative;
      width: 296px;
      min-height: 52px;
      margin: 0 0 8px;
      border: 2px solid #567f9d;
      border-radius: 6px;
      color: #0c1d31;
      background: #dbeaf5;
      font-size: 13px;
    }
    .row.muted {
      opacity: 0.62;
    }
    .row.locked {
      background: #c2cad3;
    }
    .row-title {
      position: absolute;
      left: 54px;
      top: 6px;
      width: 164px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-sub {
      position: absolute;
      left: 54px;
      top: 28px;
      width: 164px;
      font-size: 12px;
    }
    .placeholder {
      position: absolute;
      display: grid;
      place-items: center;
      border-radius: 4px;
      color: white;
      background: #557995;
      font-weight: 700;
    }
    .map-thumb {
      position: absolute;
      left: 10px;
      top: 7px;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: #fff;
      background: #557995;
      font: 800 15px Arial, Helvetica, sans-serif;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .map-thumb::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14px;
      background: rgba(0, 0, 0, 0.25);
    }
    .avatar-card {
      position: absolute;
      width: 92px;
      height: 92px;
      border: 2px solid #5b7f9e;
      border-radius: 6px;
      color: #0c1d31;
      background: #d3e1ee;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .avatar-card.active {
      border: 3px solid #e87512;
      background: #f2c650;
    }
    .avatar-card img {
      position: absolute;
      left: 18px;
      top: 8px;
      width: 56px;
      height: 56px;
      object-fit: contain;
      pointer-events: none;
    }
    .avatar-card span {
      position: absolute;
      left: 4px;
      bottom: 7px;
      width: 84px;
      text-align: center;
      line-height: 1.1;
      pointer-events: none;
    }
    .newgame-content {
      position: relative;
      width: 304px;
      height: 740px;
    }
    .desc {
      position: absolute;
      left: 28px;
      top: 398px;
      width: 304px;
      height: 102px;
      padding: 9px 12px;
      border: 2px solid #567f9d;
      border-radius: 6px;
      color: #0c1d31;
      background: #e3eef7;
      font-size: 13px;
      line-height: 1.25;
    }
    .buy {
      position: absolute;
      right: 10px;
      top: 26px;
      width: 64px;
      height: 32px;
      border: 2px solid #e87512;
      border-radius: 6px;
      color: #0c1d31;
      background: #f2c650;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .buy:disabled {
      cursor: default;
      filter: grayscale(1);
      opacity: 0.6;
    }
    .notice {
      position: absolute;
      left: 42px;
      bottom: 26px;
      width: 276px;
      min-height: 34px;
      padding: 8px;
      border-radius: 6px;
      color: #0c1d31;
      background: #f2c650;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>

    function t(key, vars = {}) {
      let value = (text[settings.language] || text.en)[key] || text.en[key] || key;
      for (const [name, data] of Object.entries(vars)) value = value.replaceAll(`{${name}}`, data);
      return value;
    }
    function defaultSave(playerName = "KaiPlayz", avatarId = 1, avatarType = "preset") {
      return {
        slot: 1, player_name: playerName, avatar_id: avatarId, avatar_type: avatarType,
        avatar_custom_path: avatarType === "custom" ? "user://custom_avatar.png" : "",
        money: 3000, level: 0, badges: 0,
        starter_generation: 1, starter_name: "Charmander", starter_dex_number: 4,
        inventory: { ...defaultInventory }
      };
    }
    function ensureSave() {
      if (!save) save = defaultSave();
      save.inventory ||= {};
      if (Object.keys(save.inventory).length === 0) save.inventory = { ...defaultInventory };
      save.money ??= 3000;
      save.level ??= 0;
      save.badges ??= 0;
      save.starter_name ||= "Charmander";
      save.player_name ||= "KaiPlayz";
      persist();
    }
    function persist() {
      if (save) {
        localStorage.setItem("pokerpg_current_save", JSON.stringify(save));
        localStorage.setItem("pokerpg_save", JSON.stringify(save));
      }
      localStorage.setItem("pokerpg_settings", JSON.stringify(settings));
    }
    function saveKey(slot) { return `pokerpg_save_${slot}`; }
    function getSaveSlot(slot) {
      const stored = localStorage.getItem(saveKey(slot));
      if (stored) return JSON.parse(stored);
      if (slot === 1 && localStorage.getItem("pokerpg_save")) return JSON.parse(localStorage.getItem("pokerpg_save"));
      return null;
    }
    function writeSaveSlot(slot, data) {
      const nextSave = { ...data, slot };
      localStorage.setItem(saveKey(slot), JSON.stringify(nextSave));
      save = nextSave;
      persist();
    }
    function itemName(item) { return settings.language === "pt" ? item.name_pt : item.name_en; }
    function itemDesc(item) { return settings.language === "pt" ? item.description_pt : item.description_en; }

      return `${t("money")}: $${save.money}  |  ${t("level")} ${save.level}  |  ${t("badges", { n: save.badges })}`;

      return `<button class="orange ${extra}" style="left:${left}px;top:${top}px;width:${width}px;height:${height}px" onclick="${action}">${text}</button>`;
    }

      return `

        ${icon("ui/icons/icon_world_32.png", 8, 6, "showWorldMap()")}
        ${icon("ui/icons/icon_tournament_32.png", 58, 6, "showTournament()")}

        ${icon("ui/icons/icon_shop_32.png", 208, 6, "showShop()")}
        ${icon("ui/icons/icon_profile_32.png", 258, 6, "showProfile()")}
        ${icon("ui/icons/icon_options_32.png", 318, 6, "showOptions()")}
      `;
    }

      return `<button class="icon-btn" style="left:${left}px;top:${top}px" onclick="${action}"><img src="${A}${path}" alt=""></button>`;
    }
    function itemIcon(item, left = 10, top = 8, size = 36) {
      const letter = itemName(item).charAt(0) || "?";
      return `<img src="${A}items/${item.category}/${item.id}.png" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" style="position:absolute;left:${left}px;top:${top}px;width:${size}px;height:${size}px;object-fit:contain" alt=""><div class="placeholder" style="display:none;left:${left}px;top:${top}px;width:${size}px;height:${size}px">${letter}</div>`;
    }
    function avatarPath(dataOrId) {
      if (typeof dataOrId === "object" && dataOrId?.avatar_type === "custom") return "avatars/avatar_card_custom_image.png";
      const id = typeof dataOrId === "object" ? dataOrId.avatar_id : dataOrId;
      return avatarPaths[Math.max(0, Math.min(avatarPaths.length - 1, (Number(id) || 1) - 1))];
    }
    function saveAvatar(data, left, top, size) {
      return `<img src="${A}${avatarPath(data)}" style="position:absolute;left:${left}px;top:${top}px;width:${size}px;height:${size}px;object-fit:contain" alt="">`;
    }
    function avatarCard(id, index) {
      return `<button id="avatarCard${id}" class="avatar-card ${id === 1 ? "active" : ""}" style="left:${index % 3 * 102}px;top:${122 + Math.floor(index / 3) * 102}px" onclick="selectPresetAvatar(${id})">
        <img src="${A}${avatarPath(id)}" alt="">
        <span>${t("profile")} ${id}</span>
      </button>`;
    }
    function selectPresetAvatar(id) {
      window.previewAvatar = id;
      window.previewAvatarType = "preset";
      document.querySelectorAll(".avatar-card").forEach(card => card.classList.remove("active"));
      document.getElementById(`avatarCard${id}`)?.classList.add("active");
      const hint = document.getElementById("customAvatarHint");
      if (hint) hint.style.display = "none";
    }
    function selectCustomAvatar() {
      window.previewAvatar = 0;
      window.previewAvatarType = "custom";
      document.querySelectorAll(".avatar-card").forEach(card => card.classList.remove("active"));
      document.getElementById("avatarCardCustom")?.classList.add("active");
      const hint = document.getElementById("customAvatarHint");
      if (hint) hint.style.display = "block";
    }
    function mapThumb(key, img) {
      const [color, code] = mapFallbacks[key] || ["#557995", "MAP"];
      if (!img) return `<div class="map-thumb" style="background:${color}">${code}</div>`;
      return `<img src="${A}${img}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'" style="position:absolute;left:10px;top:7px;width:52px;height:52px;object-fit:contain" alt=""><div class="map-thumb" style="display:none;background:${color}">${code}</div>`;
    }
    function showMainMenu() {
      currentBase = "main";
      phone.innerHTML = `
        <section class="screen">
          <img class="logo" src="${A}ui/logo_pokerpg_512x200.png" style="left:36px;top:70px;width:288px;height:112px" alt="PokeRPG">
          ${orange(t("load_game"), 70, 250, 220, 48, "showLoadGamePopup()")}
          ${orange(t("new_game"), 70, 310, 220, 48, "showNewGamePopup()")}
          ${orange(t("options"), 70, 370, 220, 48, "showOptions()")}
          ${orange(t("about"), 70, 430, 220, 48, "message(t('about'), t('about_message'))")}
          <p class="label" style="left:20px;top:594px;width:320px;font-size:13px">Private remake prototype</p>
        </section>
      `;
    }
    function showNewGamePopup() {
      window.previewAvatar = 1;
      window.previewAvatarType = "preset";
      phone.innerHTML = phone.innerHTML + overlay(t("new_game"), 42, 560) + `
        <div class="scroll" style="left:28px;top:112px;width:304px;height:420px">
          <div class="newgame-content">
            <p class="label" style="left:0;top:0;width:296px;color:#0c1d31;text-shadow:none;text-align:left;font-size:15px">${t("player_name")}</p>
            <input id="playerNameInput" style="position:absolute;left:0;top:28px;width:296px;height:38px;border:2px solid #567f9d;border-radius:6px;padding:0 10px;font-size:16px" placeholder="${settings.language === "pt" ? "Digite seu nome" : "Enter your name"}">
            <p class="label" style="left:0;top:88px;width:296px;color:#0c1d31;text-shadow:none;font-size:16px">${t("choose_avatar")}</p>
            ${[1,2,3,4,5,6].map((id, i) => avatarCard(id, i)).join("")}
            <p class="label" style="left:0;top:322px;width:296px;color:#0c1d31;text-shadow:none;font-size:16px">${t("custom_image")}</p>
            <button id="avatarCardCustom" class="avatar-card" style="left:102px;top:352px" onclick="selectCustomAvatar()">
              <img src="${A}avatars/avatar_card_custom_image.png" alt="">
              <span>${t("custom_image")}</span>
            </button>
            <p id="customAvatarHint" class="label" style="display:none;left:8px;top:444px;width:288px;color:#0c1d31;text-shadow:none;font-size:11px">${t("custom_help")}</p>
            <p class="label" style="left:0;top:466px;width:296px;color:#0c1d31;text-shadow:none;font-size:16px">${t("choose_generation")}</p>
            ${[1,2,3,4,5,6,7,8].map((id, i) => `<button class="tab ${id === 1 ? "active" : ""}" style="left:${(i % 4) * 74}px;top:${502 + Math.floor(i / 4) * 42}px;width:68px" onclick="${id === 1 ? "" : "message('Gen " + id + "', t('coming_soon'))"}">Gen ${id}</button>`).join("")}
            <p class="label" style="left:0;top:600px;width:296px;color:#0c1d31;text-shadow:none;font-size:16px">${t("choose_starter")}</p>
            ${["Bulbasaur", "Charmander", "Squirtle"].map((name, i) => `<button class="tab ${name === "Charmander" ? "active" : ""}" style="left:${i * 102}px;top:636px;width:92px;height:42px" onclick="${name === "Charmander" ? "" : "message('" + name + "', t('coming_soon'))"}">${name}</button>`).join("")}
          </div>
        </div>
        ${orange(t("cancel"), 36, 546, 140, 44, "closeOverlay()", "small")}
        ${orange(t("start_game"), 184, 546, 140, 44, "startNewGame()", "small")}
      </div>`;
    }
    function startNewGame() {
      const input = document.getElementById("playerNameInput");
      const fallbackName = settings.language === "pt" ? "Jogador" : "Player";
      const name = (input?.value || "").trim() || fallbackName;
      writeSaveSlot(1, defaultSave(name, window.previewAvatar || 1, window.previewAvatarType || "preset"));
      showHome();
    }
    function showLoadGamePopup() {
      phone.innerHTML = phone.innerHTML + overlay(t("load_game"), 60, 520) + `
        ${[1,2,3].map(slot => {
          const data = getSaveSlot(slot);
          if (!data) return `<button class="row" style="position:absolute;left:28px;top:${134 + (slot - 1) * 104}px;width:304px;height:82px" onclick="message(t('load_game'), t('empty_save_slot'))">${t("empty_slot")}</button>`;
          return `<div class="row" style="position:absolute;left:28px;top:${134 + (slot - 1) * 104}px;width:304px;height:82px">
            ${saveAvatar(data, 10, 13, 48)}
            <span style="position:absolute;left:66px;top:7px;width:132px;font-size:11px">${t("empty_slot")} ${slot}<br>${data.player_name}<br>${t("starter")}: ${data.starter_name || "Charmander"}<br>${t("money")}: $${data.money || 3000} | ${t("level")} ${data.level || 0} | ${t("badges", { n: data.badges || 0 })}</span>
            <button class="buy" style="right:72px;top:10px" onclick="loadSlot(${slot})">${t("load")}</button>
            <button class="buy" style="right:8px;top:10px;background:#b93936;color:#fff" onclick="deleteSlot(${slot})">${t("delete")}</button>
          </div>`;
        }).join("")}
        ${orange(t("cancel"), 70, 522, 220, 48, "closeOverlay()")}
      </div>`;
    }
    function loadSlot(slot) {
      const data = getSaveSlot(slot);
      if (!data) { message(t("load_game"), t("empty_save_slot")); return; }
      save = data;
      persist();
      showHome();
    }
    function deleteSlot(slot) {
      localStorage.removeItem(saveKey(slot));
      showMainMenu();
      showLoadGamePopup();
    }
    function showHome() {
      ensureSave();
      currentBase = "home";
      phone.innerHTML = `
        <section class="screen">
          ${topbar()}
          <p class="label" style="left:20px;top:54px;width:320px;font-size:18px">${t("hello", { name: save.player_name })}</p>
          <p class="label" style="left:20px;top:82px;width:320px;font-size:16px">${t("welcome_to")}</p>
          <img class="logo" src="${A}ui/logo_pokerpg_512x200.png" style="left:82px;top:108px;width:196px;height:76px" alt="PokeRPG">
          <p class="label" style="left:16px;top:188px;width:328px;font-size:13px">${stats()}</p>
          <p class="label" style="left:20px;top:220px;width:320px;font-size:14px">${t("tutorial_prompt")}</p>
          ${orange(t("tutorial"), 70, 248, 220, 48, "message(t('tutorial'), t('tutorial_soon'))")}
        </section>
      `;
    }
    function overlay(title, top = 42, height = 560) {
      return `<div class="overlay"><div class="shade"></div><div class="panel" style="top:${top}px;height:${height}px;width:330px"></div>
        <p class="label" style="left:50px;top:${top + 26}px;width:260px;font-size:23px;color:#0c1d31;text-shadow:none">${title}</p>
        <button class="close" style="left:298px;top:${top + 20}px" onclick="closeOverlay()"></button>`;
    }
    function closeOverlay() {
      if (currentBase === "main") showMainMenu();
      else showHome();
    }
    function redrawBase() {
      if (currentBase === "main") showMainMenu();
      else showHome();
    }
    function showProfile() {
      ensureSave();
      message(t("profile"), `${save.player_name}<br>${t("starter")}: ${save.starter_name || "Charmander"}<br>${stats()}`);
    }
    function showPokemonMenu() {
      phone.innerHTML = phone.innerHTML + overlay(t("pokemon_menu"), 92, 420) + `
        ${orange(t("my_pokemon"), 70, 168, 220, 48, "message(t('my_pokemon'), t('my_pokemon_soon'))")}
        ${orange(t("my_team_pokemon"), 70, 228, 220, 48, "message(t('my_team_pokemon'), t('my_team_pokemon_soon'))")}
        ${orange(t("pokedex"), 70, 288, 220, 48, "message(t('pokedex'), t('pokedex_soon'))")}
        ${orange(t("pokemon_center"), 70, 348, 220, 48, "message(t('pokemon_center'), t('pokemon_center_soon'))")}
      </div>`;
    }
    function showWorldMap() {
      ensureSave();
      phone.innerHTML = phone.innerHTML + overlay(t("world_map"), 34, 580) + `
        <div class="scroll" style="left:28px;top:104px;width:304px;height:468px">
          ${maps.map(([key, typeKey, img, open]) => `
            <button class="row" style="height:66px" onclick="${open ? "showForestMap()" : "message(t('world_map'), t('coming_soon'))"}">
              ${mapThumb(key, img)}
              <span class="row-title" style="top:8px">${t(key)}</span>
              <span class="row-sub" style="top:31px">${t("type")}: ${t(typeKey)}<br>${open ? t("available") : t("coming_soon")}</span>
            </button>`).join("")}
        </div></div>`;
    }
    function showForestMap() {
      ensureSave();
      phone.innerHTML = `
        <section class="screen">
          ${topbar()}
          <p class="label" style="left:60px;top:7px;width:240px;font-size:20px">Forest Map</p>
          <p class="label" style="left:20px;top:54px;width:320px;font-size:22px">Forest Map</p>
          <img src="${A}maps/map_forest_64.png" style="position:absolute;left:148px;top:88px;width:64px;height:64px;object-fit:contain" alt="">
          <p class="label" style="left:28px;top:158px;width:304px;font-size:15px">Explore this map to find rare Pokemon in the forest map exists several types of Pokemon.</p>
          <p class="label" style="left:24px;top:232px;width:312px;font-size:15px">On this map you can find Pokemon types:</p>
          ${["type_grass", "type_normal", "type_ground", "type_flying", "type_water", "type_poison", "type_bug"].map((name, i) => {
            const pos = [[20,274],[102,274],[184,274],[266,274],[61,308],[143,308],[225,308]][i];
            return `<img src="${A}badges/${name}.png" style="position:absolute;left:${pos[0]}px;top:${pos[1]}px;width:78px;height:24px;object-fit:contain" alt="">`;
          }).join("")}
          ${orange("Explore Map", 70, 358, 220, 48, "message('Forest Map', 'Encounter prototype stays in Godot for now.')")}
          ${orange("Back", 110, 552, 140, 44, "showHome()", "small")}
        </section>`;
      currentBase = "home";
    }
    function showBag() {
      ensureSave();
      const list = items.filter(item => item.category === bagCategory);
      const selected = items.find(item => item.id === selectedItemId);
      const desc = selected ? `${itemName(selected)}<br>${t("qty")}: ${save.inventory[selected.id] || 0}<br>${itemDesc(selected)}<br>${t("items_use_hint")}` : `${t("select_item")}<br>${t("items_use_hint")}`;
      phone.innerHTML = phone.innerHTML + overlay(t("bag"), 42, 560) + `
        ${categoryTabs("bag")}
        <div class="scroll" style="left:28px;top:146px;width:304px;height:250px">
          ${list.map(item => {
            const amount = save.inventory[item.id] || 0;
            return `<button class="row ${amount ? "" : "muted"}" onclick="selectBagItem('${item.id}')">
              ${itemIcon(item)}
              <span class="row-title">${itemName(item)}</span>
              <span class="row-sub">${t("qty")}: ${amount}</span>
              <span style="position:absolute;right:20px;top:16px;font-weight:700">></span>
            </button>`;
          }).join("")}
        </div>
        <div class="desc">${desc}</div>
        ${orange(t("details"), 110, 512, 140, 44, "useBagItem()", "small")}
      </div>`;
    }
    function categoryTabs(kind) {
      return categories.map((cat, i) => {
        const active = (kind === "bag" ? bagCategory : shopCategory) === cat ? "active" : "";
        const action = kind === "bag" ? `chooseBagCategory('${cat}')` : `chooseShopCategory('${cat}')`;
        return `<button class="tab ${active}" style="left:${20 + i * 80}px;top:${kind === "bag" ? 102 : 126}px" onclick="${action}">${t(cat)}</button>`;
      }).join("");
    }
    function chooseBagCategory(category) {
      bagCategory = category;
      selectedItemId = "";
      showHome();
      showBag();
    }
    function chooseShopCategory(category) {
      shopCategory = category;
      showHome();
      showShop();
    }
    function selectBagItem(id) {
      selectedItemId = id;
      showHome();
      showBag();
    }
    function useBagItem() {
      const item = items.find(data => data.id === selectedItemId);
      if (!item) return;
      message(itemName(item), `${t("qty")}: ${save.inventory[item.id] || 0}<br>${itemDesc(item)}<br>${t("items_use_hint")}`);
    }
    function showShop(notice = "") {
      ensureSave();
      const list = items.filter(item => item.category === shopCategory && item.price > 0);
      phone.innerHTML = phone.innerHTML + overlay(t("shop"), 34, 580) + `
        <img src="${A}shop/shop_sign_220x80.png" style="position:absolute;left:36px;top:78px;width:110px;height:40px;object-fit:contain" alt="">
        <img src="${A}shop/shop_clerk_128.png" style="position:absolute;left:284px;top:78px;width:40px;height:40px;object-fit:contain" alt="">
        <p class="label" style="left:142px;top:92px;width:140px;color:#0c1d31;text-shadow:none;font-size:15px">${t("money")}: $${save.money}</p>
        ${categoryTabs("shop")}
        <div class="scroll" style="left:28px;top:170px;width:304px;height:402px">
          ${list.map(item => {
            const locked = item.min_level > save.level || item.min_badges > save.badges;
            const req = t("requires", { level: item.min_level, badges: item.min_badges });
            return `<div class="row ${locked ? "locked" : ""}" style="height:104px">
              ${itemIcon(item, 10, 10, 42)}
              <span class="row-title">${itemName(item)}</span>
              <span class="row-sub">${itemDesc(item)}</span>
              <span style="position:absolute;left:54px;top:52px;width:166px;font-size:11px">${t("price")}: $${item.price}<br>${locked ? t("locked") : t("available")}<br>${req}</span>
              <button class="buy" style="top:34px" ${locked ? "disabled" : ""} onclick="buyItem('${item.id}')">${t("buy")}</button>
            </div>`;
          }).join("")}
        </div>
        ${notice ? `<div class="notice">${notice}</div>` : ""}
      </div>`;
    }
    function buyItem(id) {
      const item = items.find(data => data.id === id);
      if (!item) return;
      if (save.money < item.price) { showHome(); showShop(t("not_enough_money")); return; }
      save.money -= item.price;
      save.inventory[id] = (save.inventory[id] || 0) + 1;
      persist();
      showHome();
      showShop(t("bought", { item: itemName(item) }));
    }
    function showTournament() {
      phone.innerHTML = phone.innerHTML + overlay(t("tournament"), 92, 420) + `
        <p class="label" style="left:42px;top:162px;width:276px;color:#0c1d31;text-shadow:none;font-size:15px">${t("tournament_soon")}</p>
        ${["beginner_cup", "forest_cup", "master_league"].map((key, i) => `
          <div class="row" style="position:absolute;left:42px;top:${230 + i * 66}px;width:276px;height:54px">
            <span class="row-title" style="left:12px">${t(key)}</span>
            <span class="row-sub" style="left:12px">${t("coming_soon")}</span>
            <img src="${A}icons/icon_trophy_32.png" style="position:absolute;right:18px;top:10px;width:32px;height:32px" alt="">
          </div>`).join("")}
      </div>`;
    }
    function showOptions() {
      phone.innerHTML = phone.innerHTML + overlay(t("options"), 110, 360) + `
        <p class="label" style="left:46px;top:180px;width:268px;color:#0c1d31;text-shadow:none;font-size:16px">${t("music")}: ON</p>
        <p class="label" style="left:46px;top:224px;width:268px;color:#0c1d31;text-shadow:none;font-size:16px">${t("sfx")}: ON</p>
        <button class="tab active" style="left:78px;top:286px;width:96px" onclick="setLanguage('en')">English</button>
        <button class="tab active" style="left:186px;top:286px;width:96px" onclick="setLanguage('pt')">Português</button>
        ${orange(t("apply"), 110, 370, 140, 44, "closeOverlay()", "small")}
        ${currentBase === "home" ? orange(t("exit_to_main_menu"), 70, 426, 220, 44, "confirmExit()", "small") : ""}
      </div>`;
    }
    function setLanguage(language) {
      settings.language = language;
      persist();
      redrawBase();
      showOptions();
    }
    function message(title, body) {
      phone.innerHTML = phone.innerHTML + `<div class="overlay"><div class="shade"></div><div class="panel" style="top:110px;height:360px;width:330px"></div>
        <p class="label" style="left:44px;top:140px;width:272px;color:#0c1d31;text-shadow:none;font-size:22px">${title}</p>
        <p class="label" style="left:42px;top:205px;width:276px;color:#0c1d31;text-shadow:none;font-size:18px">${body}</p>
        <button class="close" style="left:298px;top:128px" onclick="closeOverlay()"></button>
        ${orange("OK", 70, 370, 220, 48, "closeOverlay()")}
      </div>`;
    }
    function confirmExit() {
      phone.innerHTML = phone.innerHTML + `<div class="overlay"><div class="shade"></div><div class="panel" style="top:150px;height:300px;width:330px"></div>
        <p class="label" style="left:44px;top:184px;width:272px;color:#0c1d31;text-shadow:none;font-size:22px">${t("exit")}</p>
        <p class="label" style="left:42px;top:246px;width:276px;color:#0c1d31;text-shadow:none;font-size:18px">${t("return_menu")}</p>
        ${orange(t("yes"), 38, 356, 140, 44, "showMainMenu()", "small")}
        ${orange(t("no"), 182, 356, 140, 44, "closeOverlay()", "small")}
      </div>`;
    }
    window.t = t;
    window.stats = stats;
    window.loadGame = showLoadGamePopup;
    window.newGame = showNewGamePopup;
    window.showLoadGamePopup = showLoadGamePopup;
    window.showNewGamePopup = showNewGamePopup;
    window.startNewGame = startNewGame;
    window.loadSlot = loadSlot;
    window.deleteSlot = deleteSlot;
    window.showHome = showHome;
    window.showMainMenu = showMainMenu;
    window.showWorldMap = showWorldMap;
    window.showForestMap = showForestMap;
    window.showBag = showBag;
    window.showShop = showShop;
    window.showTournament = showTournament;
    window.showPokemonMenu = showPokemonMenu;
    window.showOptions = showOptions;
    window.showProfile = showProfile;
    window.message = message;
    window.confirmExit = confirmExit;
    window.closeOverlay = closeOverlay;
    window.redrawBase = redrawBase;
    window.chooseBagCategory = chooseBagCategory;
    window.chooseShopCategory = chooseShopCategory;
    window.selectBagItem = selectBagItem;
    window.setLanguage = setLanguage;
    window.useBagItem = useBagItem;
    window.buyItem = buyItem;
    window.settings = settings;
    window.previewAvatar = 1;
    Object.defineProperty(window, "bagCategory", { get: () => bagCategory, set: value => { bagCategory = value; } });
    Object.defineProperty(window, "shopCategory", { get: () => shopCategory, set: value => { shopCategory = value; } });
    Object.defineProperty(window, "selectedItemId", { get: () => selectedItemId, set: value => { selectedItemId = value; } });
    showMainMenu();
  </script>
</body>
</html>
