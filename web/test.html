<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeRPG UI Test</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      min-height: 100%;
      margin: 0;
      background: #15191f;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
    }
    #phone {
      position: relative;
      width: 360px;
      height: 640px;
      overflow: hidden;
      color: white;
      background: url("../assets/backgrounds/gray_texture_360x640.png") center / cover no-repeat;
      image-rendering: pixelated;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }
    .screen, .overlay {
      position: absolute;
      inset: 0;
    }
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 360px;
      height: 44px;
      background: url("../assets/ui/topbar_360x44.png") center / 100% 100% no-repeat;
    }
    .logo {
      position: absolute;
      object-fit: contain;
      image-rendering: auto;
    }
    .label {
      position: absolute;
      margin: 0;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.65);
      overflow-wrap: break-word;
    }
    button {
      border: 0;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .orange {
      position: absolute;
      display: grid;
      place-items: center;
      color: white;
      font: 700 16px Arial, Helvetica, sans-serif;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.52);
      background: url("../assets/ui/button_orange_220x48.png") center / 100% 100% no-repeat;
    }
    .orange.big {
      background-image: url("../assets/ui/button_orange_250x52.png");
    }
    .orange.small {
      background-image: url("../assets/ui/button_orange_180x40.png");
      font-size: 13px;
    }
    .orange:active {
      transform: translateY(1px);
      filter: brightness(0.92);
    }
    .orange:disabled {
      cursor: default;
      filter: grayscale(1);
      opacity: 0.64;
      transform: none;
    }
    .icon-btn {
      position: absolute;
      width: 32px;
      height: 32px;
      background: transparent;
    }
    .icon-btn img {
      width: 32px;
      height: 32px;
      pointer-events: none;
    }
    .icon-btn.icon-fallback {
      display: grid;
      place-items: center;
      border: 1px solid #123f54;
      border-radius: 6px;
      color: #fff;
      background: #3b819d;
      font: 700 13px Arial, Helvetica, sans-serif;
    }
    .actions {
      position: absolute;
      left: 42px;
      top: 312px;
      width: 276px;
      height: 306px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .actions-inner {
      position: relative;
      height: 472px;
    }
    .shade {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
    }
    .panel {
      position: absolute;
      left: 15px;
      background: url("../assets/ui/popup_panel_blue_330x520.png") center / 100% 100% no-repeat;
    }
    .close {
      position: absolute;
      width: 32px;
      height: 32px;
      background: url("../assets/icons/icon_close_32.png") center / 32px 32px no-repeat;
    }
    .tab {
      position: absolute;
      width: 76px;
      height: 32px;
      border: 2px solid #5b7f9e;
      border-radius: 6px;
      color: #0c1d31;
      background: #d3e1ee;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .tab.active {
      border-color: #e87512;
      background: #f2c650;
    }
    .scroll {
      position: absolute;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .row {
      position: relative;
      width: 296px;
      min-height: 52px;
      margin: 0 0 8px;
      border: 2px solid #567f9d;
      border-radius: 6px;
      color: #0c1d31;
      background: #dbeaf5;
      font-size: 13px;
      overflow: hidden;
    }
    .row.muted {
      opacity: 0.62;
    }
    .row.locked {
      background: #c2cad3;
    }
    .row-title {
      position: absolute;
      left: 54px;
      top: 6px;
      width: 164px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-sub {
      position: absolute;
      left: 54px;
      top: 28px;
      width: 164px;
      font-size: 12px;
      line-height: 1.18;
      overflow: hidden;
    }
    .pokemon-anim {
      image-rendering: pixelated;
      pointer-events: none;
    }
    .pokemon-hit {
      animation: damageFlash 0.36s steps(2, end);
    }
    .pokemon-static {
      image-rendering: pixelated;
      pointer-events: none;
      animation: idleFloat 1.25s ease-in-out infinite alternate;
    }
    .move-effect {
      position: absolute;
      width: 96px;
      height: 96px;
      object-fit: contain;
      pointer-events: none;
      animation: effectPop 0.36s ease-out forwards;
      image-rendering: auto;
    }
    @keyframes damageFlash {
      0%, 100% { opacity: 1; filter: none; }
      20%, 60% { opacity: 0.18; filter: brightness(2.1); }
      40%, 80% { opacity: 1; filter: none; }
    }
    @keyframes effectPop {
      0% { opacity: 0; transform: scale(0.72) rotate(-8deg); }
      24% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.28) rotate(8deg); }
    }
    @keyframes idleFloat {
      from { transform: translateY(0); }
      to { transform: translateY(-3px); }
    }
    .dex-desc {
      position: absolute;
      left: 12px;
      top: 84px;
      width: 272px;
      height: 62px;
      font-size: 10px;
      line-height: 1.18;
      overflow: hidden;
    }
    .center-status {
      position: absolute;
      left: 42px;
      top: 500px;
      width: 276px;
      height: 36px;
      display: grid;
      place-items: center;
      color: #0c1d31;
      font: 700 11px Arial, Helvetica, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .placeholder {
      position: absolute;
      display: grid;
      place-items: center;
      border-radius: 4px;
      color: white;
      background: #557995;
      font-weight: 700;
    }
    .map-thumb {
      position: absolute;
      left: 10px;
      top: 7px;
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: #fff;
      background: #557995;
      font: 800 15px Arial, Helvetica, sans-serif;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .map-thumb::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 14px;
      background: rgba(0, 0, 0, 0.25);
    }
    .avatar-card {
      position: absolute;
      width: 92px;
      height: 92px;
      border: 2px solid #5b7f9e;
      border-radius: 6px;
      color: #0c1d31;
      background: #d3e1ee;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .avatar-card.active {
      border: 3px solid #e87512;
      background: #f2c650;
    }
    .avatar-card img {
      position: absolute;
      left: 18px;
      top: 8px;
      width: 56px;
      height: 56px;
      object-fit: contain;
      pointer-events: none;
    }
    .avatar-card span {
      position: absolute;
      left: 4px;
      bottom: 7px;
      width: 84px;
      text-align: center;
      line-height: 1.1;
      pointer-events: none;
    }
    .newgame-content {
      position: relative;
      width: 304px;
      height: 830px;
    }
    .desc {
      position: absolute;
      left: 28px;
      top: 398px;
      width: 304px;
      height: 102px;
      padding: 9px 12px;
      border: 2px solid #567f9d;
      border-radius: 6px;
      color: #0c1d31;
      background: #e3eef7;
      font-size: 13px;
      line-height: 1.25;
    }
    .buy {
      position: absolute;
      right: 10px;
      top: 26px;
      width: 64px;
      height: 32px;
      border: 2px solid #e87512;
      border-radius: 6px;
      color: #0c1d31;
      background: #f2c650;
      font: 700 11px Arial, Helvetica, sans-serif;
    }
    .buy:disabled {
      cursor: default;
      filter: grayscale(1);
      opacity: 0.6;
    }
    .notice {
      position: absolute;
      left: 42px;
      bottom: 26px;
      width: 276px;
      min-height: 34px;
      padding: 8px;
      border-radius: 6px;
      color: #0c1d31;
      background: #f2c650;
      text-align: center;
      font-weight: 700;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
    }
    .debug-secret {
      position: absolute;
      left: 332px;
      top: 606px;
      width: 22px;
      height: 22px;
      color: rgba(255, 255, 255, 0.52);
      background: transparent;
      font: 700 12px Arial, Helvetica, sans-serif;
    }
  </style>
